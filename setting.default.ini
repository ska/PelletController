; Pellet Controller settings. The application creates setting.ini from this
; template, in its working directory, when setting.ini is missing: edit
; setting.ini, not this file (a package update replaces this one).

[SERIAL]
; serial port of the stove board (1200 8N2)
port=/dev/ttyUSB0

[MQTT]
; Home Assistant (read only): MQTT is off while broker_addr is empty
broker_addr=
broker_port=1883
; used only when both are set
broker_uname=
broker_password=
; topics PelletController/<unique_id>/..., client id PelletController-<unique_id>
; (empty: the host name)
unique_id=
